<!doctype html>
<html lang="pt-BR" class="mop-shell-loading">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Histórico | MOP - CNC</title>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />

  <link rel="stylesheet" href="css/mop-shell.css?v=20261023-02">
</head>
<body>
  <div class="mop-shell">
    <aside class="mop-nav" data-mop-shell-sidebar aria-label="Menu de navegação"></aside>
    <div class="app-main">
      <header class="topbar mop-shared-topbar" data-mop-shell-topbar></header>
      <main class="content">
        <section class="page-header"><div><p class="eyebrow eyebrow--dark">ACOMPANHAMENTO</p><h1>Histórico de <span class="brand-text">Emissões</span></h1><p>Consulte somente as solicitações vinculadas ao seu usuário.</p></div></section>
        <section class="card history-card">
          <div class="filter-bar">
            <label class="field field--compact"><span>Buscar</span><input id="historySearch" type="search" placeholder="Pedido, franquia ou WhatsApp" /></label>
            <label class="field field--compact"><span>Status</span><select id="statusFilter"><option value="">Todos os status</option><option value="na_fila">Na fila</option><option value="emitindo">Emitindo</option><option value="enviado">Enviado</option><option value="erro">Erro</option></select></label>
            <button class="button button--secondary" id="clearFilters">Limpar filtros</button>
          </div>
          <div class="table-wrap">
            <table class="data-table"><thead><tr><th>Pedido</th><th>Data e hora</th><th>Franquia</th><th>WhatsApp</th><th>Status</th><th>Ações</th></tr></thead><tbody id="historyTableBody"></tbody></table>
          </div>
          <div class="empty-state" id="historyEmpty" hidden>Nenhum pedido encontrado com os filtros atuais.</div>
        </section>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mop-shell.js?v=20261023-02"></script>
  <script src="js/app.js?v=20261023-01"></script>
  <script src="js/history.js?v=20261023-01"></script>
  <script src="js/detail.js?v=20261023-01"></script>
  <script src="js/emissoes-router.js?v=20261023-01"></script>

</body>
</html>
