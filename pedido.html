<!doctype html>
<html lang="pt-BR" class="mop-shell-loading">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalhes do pedido | MOP - CNC</title>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />

  <link rel="stylesheet" href="css/mop-shell.css?v=20261023-01">
</head>
<body>
  <div class="app-shell mop-shell-enabled">
    <aside class="sidebar mop-shared-sidebar" data-mop-shell-sidebar aria-label="Menu de navegação"></aside>
    <div class="app-main">
      <header class="topbar mop-shared-topbar" data-mop-shell-topbar></header>
      <main class="content">
        <div class="detail-top"><a class="button button--secondary" href="historico.html">← Voltar</a><span id="detailStatus"></span></div>
        <section class="page-header"><div><p class="eyebrow eyebrow--dark">PEDIDO <span id="detailIdEyebrow"></span></p><h1>Detalhes da <span class="brand-text">Solicitação</span></h1><p>Acompanhe o estado e os dados enviados no pedido.</p></div></section>
        <section class="detail-grid">
          <article class="card detail-card"><h2>Dados do pedido</h2><dl class="detail-list"><div><dt>ID do pedido</dt><dd id="detailId">—</dd></div><div><dt>Franquia</dt><dd id="detailFranchise">—</dd></div><div><dt>WhatsApp</dt><dd id="detailWhatsapp">—</dd></div><div><dt>Solicitado em</dt><dd id="detailCreated">—</dd></div></dl></article>
          <article class="card detail-card">
            <h2>Linha do tempo</h2>
            <ol class="timeline" id="timeline"></ol>
            <div class="error-reason-box" id="detailErrorReason" role="alert" hidden>
              <strong>Motivo do erro</strong>
              <p id="detailErrorReasonText"></p>
            </div>
          </article>
        </section>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mop-shell.js?v=20261023-01"></script>
  <script src="js/app.js?v=20261023-01"></script>
  <script src="js/history.js?v=20261023-01"></script>
  <script src="js/detail.js?v=20261023-01"></script>
  <script src="js/emissoes-router.js?v=20261023-01"></script>

</body>
</html>
