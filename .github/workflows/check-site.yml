name: Verificar sintaxe do site
on:
  pull_request:
    paths:
      - 'js/**'
      - '.github/workflows/check-site.yml'
  push:
    branches: [feat/site-unico-multiextracoes-homologacao]
    paths:
      - 'js/**'
      - '.github/workflows/check-site.yml'
jobs:
  js-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
